apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-reader-afoke
  namespace: team-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-reader         # the role being given
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: afoke                 # the user getting it
